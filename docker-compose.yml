version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pupr-id-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pupr-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: pupr-id-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_PROXY: edge
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-config/theme:/opt/keycloak/themes/pupr-theme
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pupr-network

  redis:
    image: redis:7-alpine
    container_name: pupr-id-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pupr-network

networks:
  pupr-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
