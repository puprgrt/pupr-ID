version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: pupr-id-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: ${SUPABASE_DB_URL}
      KC_DB_USERNAME: ${SUPABASE_DB_USERNAME}
      KC_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: localhost
      KC_PROXY: edge
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak-config/theme:/opt/keycloak/themes/pupr-theme
    networks:
      - pupr-network

  redis:
    image: redis:7-alpine
    container_name: pupr-id-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pupr-network

networks:
  pupr-network:
    driver: bridge

volumes:
  redis_data:
